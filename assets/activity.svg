<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Six-year GitHub activity</title>
<desc id="desc">Generated GitHub profile analytics for Kushal Agrawal.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#0B1622"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6EE7F2"/><stop offset="1" stop-color="#8B9FFF"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#294055" stroke-opacity=".16"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .title{fill:#EAF2F8;font-size:24px;font-weight:650;letter-spacing:1.2px}
    .eyebrow{fill:#6EE7F2;font-size:12px;font-weight:700;letter-spacing:3px}
    .muted{fill:#8495A7}
  </style>
</defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/>
<rect width="1200" height="390" rx="24" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="389" rx="23.5" fill="none" stroke="#26394B"/>

