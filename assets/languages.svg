<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Language distribution</title>
<desc id="desc">Generated GitHub profile analytics for Kushal Agrawal.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#0B1622"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6EE7F2"/><stop offset="1" stop-color="#8B9FFF"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#294055" stroke-opacity=".16"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .title{fill:#EAF2F8;font-size:24px;font-weight:650;letter-spacing:1.2px}
    .eyebrow{fill:#6EE7F2;font-size:12px;font-weight:700;letter-spacing:3px}
    .muted{fill:#8495A7}
  </style>
</defs>
<rect width="1200" height="500" rx="24" fill="url(#bg)"/>
<rect width="1200" height="500" rx="24" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="499" rx="23.5" fill="none" stroke="#26394B"/>

<text x="54" y="49" class="eyebrow mono">LANGUAGE DISTRIBUTION</text>
<text x="54" y="78" class="title sans">Codebase composition</text>
<text x="1146" y="55" class="mono muted" font-size="11" text-anchor="end">LOC / OWNED REPOSITORIES</text>
<line x1="678" y1="122" x2="678" y2="447" stroke="#233547"/>
<circle cx="260" cy="294" r="126" fill="#0B1622" stroke="#233547"/>
<path d="M263.30,168.04 A126,126 0 1,1 256.70,168.04 L257.85,212.03 A82,82 0 1,0 262.15,212.03 Z" fill="#6EE7F2"/>
<circle cx="260" cy="294" r="80" fill="#071019" stroke="#233547"/>
<text x="260" y="290" class="sans" fill="#EAF2F8" font-size="28" font-weight="700" text-anchor="middle">SYNC</text>
<text x="260" y="316" class="mono muted" font-size="10" letter-spacing="1.5" text-anchor="middle">PENDING</text>
<rect x="430" y="158" width="10" height="10" rx="2" fill="#6EE7F2"/><text x="452" y="169" class="sans" fill="#EAF2F8" font-size="14">Pending</text><text x="622" y="169" class="mono muted" font-size="12" text-anchor="end">—</text>
<text x="755" y="139" class="mono" fill="#6EE7F2" font-size="11" font-weight="700" letter-spacing="1.6">RELATIVE SOURCE FOOTPRINT</text>
<path d="M735 405H1132" stroke="#233547"/><path d="M735 405l20-14h397" stroke="#233547" opacity=".55"/>

<g>
  <path d="M755 371l10-7h34l-10 7z" fill="#6EE7F2" opacity=".92"/>
  <path d="M789 371l10-7v34l-10 7z" fill="#6EE7F2" opacity=".42"/>
  <rect x="755" y="371" width="34" height="34" fill="#6EE7F2" opacity=".72"/>
  <text x="772" y="432" class="mono muted" font-size="10" text-anchor="middle">PENDI</text>
</g>
</svg>
